<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="-11 -11 22 22"><style>.lg-flow { animation: flow 0.9s linear infinite; }.lg-wring { transform-box: fill-box; transform-origin: center; animation: owe 1.8s cubic-bezier(0.2, 0.7, 0.2, 1) infinite; }.lg-still { display: none; } @keyframes flow { to { stroke-dashoffset: -11; } }@keyframes owe { from { transform: scale(1); opacity: 0.9; } to { transform: scale(1.7); opacity: 0; } }@media (prefers-reduced-motion: reduce){.lg-flow { animation: none; }.lg-wring { display: none; }.lg-flow-dots { display: none; }.lg-still { display: inline; }}</style><circle r="5" fill="#b4552f"/><circle class="lg-wring" r="6.5" fill="none" stroke="#4a4f57" stroke-width="2"/><g class="lg-still" opacity="0.7"><circle cx="-5" cy="9.5" r="1.5" fill="#4a4f57"/><circle cx="0" cy="9.5" r="1.5" fill="#4a4f57"/><circle cx="5" cy="9.5" r="1.5" fill="#4a4f57"/></g></svg>
